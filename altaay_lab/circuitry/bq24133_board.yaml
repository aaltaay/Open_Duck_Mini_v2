  - {id: QI, ref: Q7, part: "onsemi 2N7002, Pi end-charge pulls ISET below 40 mV", kind: fet_n, pins: [{pin: D, dir: in}, {pin: G, dir: in}, {pin: S, dir: gnd}]}
  - {id: RCG, ref: R30, part: "100 kOhm clamp gate pulldown", kind: resistor, value_ohm: 100000, pins: [{pin: A, dir: in}, {pin: B, dir: gnd}]}
  - {id: RONPD, ref: R31, part: "100 kOhm ON pin pulldown, open means off", kind: resistor, value_ohm: 100000, pins: [{pin: A, dir: in}, {pin: B, dir: gnd}]}
