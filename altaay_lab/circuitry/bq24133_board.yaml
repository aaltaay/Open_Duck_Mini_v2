    kind: ic
    pins:
      - {pin: ACP, dir: in}
      - {pin: ACN, dir: in}
      - {pin: CMSRC, dir: out}
      - {pin: ACDRV, dir: out}
      - {pin: PVCC, dir: pwr}
      - {pin: AVCC, dir: pwr}
      - {pin: SW, dir: out}
      - {pin: BTST, dir: pwr}
      - {pin: REGN, dir: pwr}
      - {pin: SRP, dir: in}
      - {pin: SRN, dir: in}
      - {pin: BATDRV, dir: out}
      - {pin: ISET, dir: in}
      - {pin: ACSET, dir: in}
      - {pin: OVPSET, dir: in}
      - {pin: TS, dir: in}
      - {pin: TTC, dir: in}
      - {pin: STAT, dir: out}
      - {pin: CELL, dir: in}
      - {pin: VREF, dir: out}
      - {pin: PGND, dir: gnd}
      - {pin: AGND, dir: gnd}
  - {id: RAV, ref: R5, part: "10 ohm into AVCC", kind: resistor, value_ohm: 10, pins: [{pin: A, dir: pwr}, {pin: B, dir: pwr}]}
  - {id: CAV, ref: C1, part: "1 uF AVCC", kind: capacitor, value_F: 1.0e-6, pins: [{pin: P, dir: pwr}, {pin: M, dir: gnd}]}
  - {id: CPV1, ref: C2, part: "10 uF PVCC", kind: capacitor, value_F: 10.0e-6, pins: [{pin: P, dir: pwr}, {pin: M, dir: gnd}]}
  - {id: CPV2, ref: C3, part: "10 uF PVCC", kind: capacitor, value_F: 10.0e-6, pins: [{pin: P, dir: pwr}, {pin: M, dir: gnd}]}
  - {id: CREG, ref: C4, part: "1 uF REGN", kind: capacitor, value_F: 1.0e-6, pins: [{pin: P, dir: pwr}, {pin: M, dir: gnd}]}
  - {id: CBT, ref: C5, part: "0.047 uF bootstrap", kind: capacitor, value_F: 4.7e-8, pins: [{pin: P, dir: pwr}, {pin: M, dir: pwr}]}
  - {id: CVRF, ref: C6, part: "1 uF VREF", kind: capacitor, value_F: 1.0e-6, pins: [{pin: P, dir: pwr}, {pin: M, dir: gnd}]}
  - {id: L1, ref: L1, part: "6.8 uH, Table 10-2 at 1 A, order code BLOCKER", kind: inductor, value_H: 6.8e-6, pins: [{pin: A, dir: pwr}, {pin: B, dir: pwr}]}
  - {id: RSNS, ref: R6, part: "10 milliohm charge sense", kind: resistor, value_ohm: 0.010, pins: [{pin: P, dir: pwr}, {pin: N, dir: pwr}]}
  - {id: COUT, ref: C7, part: "10 uF output", kind: capacitor, value_F: 10.0e-6, pins: [{pin: P, dir: pwr}, {pin: M, dir: gnd}]}
  - {id: CACP, ref: C8, part: "0.1 uF ACP to AGND", kind: capacitor, value_F: 1.0e-7, pins: [{pin: P, dir: pwr}, {pin: M, dir: gnd}]}
  - {id: CACD, ref: C9, part: "0.1 uF ACP to ACN", kind: capacitor, value_F: 1.0e-7, pins: [{pin: P, dir: pwr}, {pin: M, dir: pwr}]}
  - {id: CSRP, ref: C10, part: "0.1 uF SRP to AGND", kind: capacitor, value_F: 1.0e-7, pins: [{pin: P, dir: pwr}, {pin: M, dir: gnd}]}
  - {id: CSRD, ref: C11, part: "0.1 uF SRP to SRN", kind: capacitor, value_F: 1.0e-7, pins: [{pin: P, dir: pwr}, {pin: M, dir: pwr}]}
  - {id: RIH, ref: R7, part: "154 kOhm ISET top", kind: resistor, value_ohm: 154000, pins: [{pin: A, dir: pwr}, {pin: B, dir: in}]}
  - {id: RIL, ref: R8, part: "10.0 kOhm ISET bottom", kind: resistor, value_ohm: 10000, pins: [{pin: A, dir: in}, {pin: B, dir: gnd}]}
  - {id: RAH, ref: R9, part: "31.6 kOhm ACSET top", kind: resistor, value_ohm: 31600, pins: [{pin: A, dir: pwr}, {pin: B, dir: in}]}
  - {id: RAL, ref: R10, part: "10.0 kOhm ACSET bottom", kind: resistor, value_ohm: 10000, pins: [{pin: A, dir: in}, {pin: B, dir: gnd}]}
  - {id: ROH, ref: R11, part: "102 kOhm OVPSET top", kind: resistor, value_ohm: 102000, pins: [{pin: A, dir: pwr}, {pin: B, dir: in}]}
