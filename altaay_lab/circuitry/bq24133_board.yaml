# bq24133_board.yaml: schematic netlist of the 3S charger board.
# Same shape as circuitry/charger_board.yaml. This file does not replace wiring/netlist.yaml.
# The 2S MCP73213 netlist stays in charger_board.yaml.
# Rev 2026-11-13 (America/New_York).

meta:
  title: Open Duck Mini v2, BQ24133 charger board, schematic netlist
  rev: "2026-11-13"
  units: {length: mm, current: A, voltage: V}
  board: CB3
  chip: BQ24133
  datasheet: "https://www.ti.com/lit/ds/symlink/bq24133.pdf"
  datasheet_id: SLUSAF7D
  note: "Board-level only. The servo bus is not the charger system node. See SERVO_RAIL.md."

domains:
  NEST: {v_min: 0.0, v_max: 26.0, note: "Fused contacts. Design 15.0 V. SMAJ16A clamps at 26.0 V. AVCC abs max is 30 V. PVCC abs max is 20 V."}
  SYS: {v_min: 0.0, v_max: 20.0, note: "After the ACFET. Charger input only. Not the servo bus."}
  PACK: {v_min: 9.0, v_max: 12.6, note: "Three P45B cells. CELL tied to VREF regulates 12.6 V."}
  VREF: {v_min: 0.0, v_max: 3.6, note: "BQ24133 VREF, 3.3 V. Abs max of the pin is 3.6 V."}
  GPIO: {v_min: 0.0, v_max: 3.6, note: "Pi 3.3 V."}
  GND: {v_min: 0.0, v_max: 0.0, note: "AGND, PGND, nest return, pack return."}

nets:
  GND: {domain: GND}
  NEST_P: {domain: NEST}
  NEST_FUSED: {domain: NEST}
  ACN: {domain: NEST}
  CMSRC: {domain: SYS}
  CMSRC_PIN: {domain: SYS}
  GATE_DRV: {domain: SYS}
  BATDRV: {domain: PACK}
  GATE: {domain: SYS}
  SYS: {domain: SYS}
  AVCC: {domain: NEST, note: "Adapter side, before the input FETs. The chip needs AVCC 300 mV above SRN before those FETs turn on."}
  PACK: {domain: PACK}
  BGATE: {domain: PACK}
  SW: {domain: PACK}
  SRP: {domain: PACK}
  VREF: {domain: VREF}
  ISET: {domain: VREF}
  ACSET: {domain: VREF}
  OVP: {domain: NEST}
  TS: {domain: VREF}
  STAT: {domain: VREF}
  TTC: {domain: VREF}
  BTST: {domain: SYS}
  REGN: {domain: SYS}
  VREF_TL: {domain: VREF, note: "TL431 rail for the pack window. Absolute voltage BLOCKER."}
  NTC: {domain: VREF}
  COLD_TH: {domain: VREF}
  HOT_TH: {domain: VREF}
  ON_TH: {domain: VREF}
  NEST_TAP: {domain: NEST}
  "ON": {domain: GPIO, note: "Pi to the servo switch ON pin. The nest comparator does not land here."}
  DOCK: {domain: GPIO, note: "Low while the nest tap is above the threshold. Gates the clamp P-FET."}
  CLAMP: {domain: GPIO, note: "High turns the N-FET that shorts the servo ON pin to ground."}
  PI_END: {domain: GPIO, note: "Pi end-charge. High releases the clamp and pulls ISET down."}
  PDRV: {domain: GPIO, note: "P-FET drain, before the 10 kOhm into the clamp gate."}
  PI_EN: {domain: GPIO}
  PI_3V3: {domain: GPIO}

components:
  - {id: JIN, ref: J1, part: "nest splices, plus and minus", kind: connector, pins: [{pin: P, dir: pwr_in}, {pin: M, dir: gnd}]}
  - {id: F1, ref: F1, part: "5 A ATO fuse, same holder as the 2S board", kind: fuse, pins: [{pin: IN, dir: pwr_in}, {pin: OUT, dir: pwr_out}]}
  - {id: TVS, ref: D1, part: "Littelfuse SMAJ16A", kind: tvs, pins: [{pin: K, dir: pwr}, {pin: A, dir: gnd}]}
  - {id: RAC, ref: R1, part: "20 milliohm adapter sense", kind: resistor, value_ohm: 0.020, pins: [{pin: P, dir: pwr}, {pin: N, dir: pwr}]}
  - {id: Q2, ref: Q2, part: "RBFET, N-channel, CSD17313 example", kind: fet_n, pins: [{pin: D, dir: pwr}, {pin: S, dir: pwr}, {pin: G, dir: in}]}
  - {id: Q1, ref: Q1, part: "ACFET, NexFET CSD17313, named in SLUSAF7D 10.2.2.5", kind: fet_n, pins: [{pin: D, dir: pwr}, {pin: S, dir: pwr}, {pin: G, dir: in}]}
  - {id: Q3, ref: Q3, part: "BATFET, P-channel, order code BLOCKER", kind: fet_p, pins: [{pin: D, dir: pwr}, {pin: S, dir: pwr}, {pin: G, dir: in}]}
  - {id: RACDRV, ref: R2, part: "4.00 kOhm ACDRV to the gates", kind: resistor, value_ohm: 4000, pins: [{pin: A, dir: out}, {pin: B, dir: in}]}
  - {id: RCMS, ref: R3, part: "4.00 kOhm CMSRC to the common source", kind: resistor, value_ohm: 4000, pins: [{pin: A, dir: out}, {pin: B, dir: in}]}
  - {id: RBAT, ref: R4, part: "1.00 kOhm BATDRV to the BATFET gate", kind: resistor, value_ohm: 1000, pins: [{pin: A, dir: out}, {pin: B, dir: in}]}
