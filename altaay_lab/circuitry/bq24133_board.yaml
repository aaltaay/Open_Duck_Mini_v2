  - {id: JON, ref: J2, part: "to Pololu 2815 ON, slide switch left off. Input of that switch is the pack only.", kind: connector, pins: [{pin: "ON", dir: out}]}
  - {id: JPK, ref: J3, part: "to BMS P+", kind: connector, pins: [{pin: P, dir: pwr}]}
  - {id: JPI, ref: J4, part: "Pi STAT, rail request, end-charge, dock flag, 3.3 V", kind: connector, pins: [{pin: STAT, dir: in}, {pin: EN, dir: out}, {pin: END, dir: out}, {pin: V3, dir: pwr}, {pin: DOCK, dir: in}]}

