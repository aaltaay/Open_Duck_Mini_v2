# Duck values for the ported autodock (autodock/duck_autodock.py). Keys are the upstream names
# (autodock_examples/configs/turtlebot3.yaml at osrf/autodock fd9c2a9) plus the duck additions.
# Sources: the phase 1 probes in the shared lab gym (overlay gym/overlays/duck; sim pass only) and the phase 2
# dock sim (twin/dock/DOCK_TWIN.md). Units: m, s, rad.
tf_expiry: 0.5
dock_timeout: 300.0
controller_rate: 10.0
left_marker: tag_1          # tag36h11 id 1, 60 mm, left of the centre tag as the duck faces the mast
right_marker: tag_2         # tag36h11 id 2, 60 mm
centre_marker: tag_0        # tag36h11 id 0, 40 mm (readable down to about 6 cm)
linear_vel_range: [-0.15, 0.15]   # trained command range
linear_y_range: [-0.20, 0.20]     # vy 0.10 gives no motion, 0.20 gives 0.092 m/s
angular_vel_range: [-0.5, 0.5]    # wz 1.0 gives only 0.09 rad/s
max_linear_vel: 0.15
min_linear_vel: 0.15              # no stepping at 0.075 and under
max_angular_vel: 0.5
min_angular_vel: 0.25
stop_yaw_diff: 0.06
stop_trans_diff: 0.02
cam_offset: 0.121                 # base origin to the tag plane with the chest on the bumper
front_dock: true
max_parallel_offset: 0.025
predock_tf_samples: 3
to_last_mile_dis: 0.25
to_last_mile_tol: 0.05
stop_distance: 0.0
max_last_mile_odom: 0.15          # blind walk allowed only while the centre tag is lost
sit_gap: 0.020                    # chest to bumper at the stop; the sit then travels 30 to 50 mm forward
sit_gap_tol: 0.004
stop_lead: 0.020                  # the duck coasts after the zero command at the 0.15 walk (dock sim, tuned)
check_ahead: 0.16                 # the check point: 0.16 m before the stop, the soles 70 mm clear of the seat end
check_battery_status: true
check_battery_timeout: 10.0
retry_count: 3
retry_retreat_dis: 0.35
staging_dis: 0.60
settle_s: 0.4
enter_max_lateral: 0.030
enter_max_yaw: 0.07
last_yaw_tol: 0.035
max_sidesteps: 6
staging_lateral: -0.025
last_lateral_tol: 0.015           # the soles clear the 40 mm seat by about 22 mm a side
right_ok: 0.030
last_right_ok: 0.015
