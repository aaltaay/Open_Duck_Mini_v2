# STS3215 C001 servos: two 3-pin bus ports in parallel (BUS1, BUS2), side by side in a slot in the bottom
# case (Tnkr). Pins named by function; kit cables are 1:1 molded leads (Feetech lists GND, VCC, signal).
# Chain: first servo of each chain gets a made lead on BUS 2 (D15), kit cables go BUS 1 -> next BUS 2.
  - id: SV20
    ref: ID20
    part: Feetech STS3215 C001 7.4 V 1:345
    kind: servo
    region: trunk_bottom
    groups: &sts_groups
      bus1: {connector: "Molex 5264-type 2.5 mm 3-pin socket", pitch_mm: 2.5}
      bus2: {connector: "Molex 5264-type 2.5 mm 3-pin socket", pitch_mm: 2.5}
    pins: &sts_pins
      - {pin: BUS1.D, label: "BUS 1", name: data, domain: BUS_DATA, group: bus1, dir: bidir, source: "[U]"}
      - {pin: BUS1.V, label: "BUS 1", name: supply, domain: SERVO_7V2, group: bus1, dir: pwr, source: "[U]"}
      - {pin: BUS1.G, label: "BUS 1", name: ground, domain: GND, group: bus1, dir: gnd, source: "[U]"}
      - {pin: BUS2.D, label: "BUS 2", name: data, domain: BUS_DATA, group: bus2, dir: bidir, source: "[U]"}
      - {pin: BUS2.V, label: "BUS 2", name: supply, domain: SERVO_7V2, group: bus2, dir: pwr, source: "[U]"}
      - {pin: BUS2.G, label: "BUS 2", name: ground, domain: GND, group: bus2, dir: gnd, source: "[U]"}
    internal: &sts_internal
      - {a: BUS1.D, b: BUS2.D, kind: short}
      - {a: BUS1.V, b: BUS2.V, kind: short}
      - {a: BUS1.G, b: BUS2.G, kind: short}
      - {a: BUS2.V, b: BUS2.G, kind: load, note: "servo; sim max 3.35 A peak, 1.45 A RMS per servo while walking"}
