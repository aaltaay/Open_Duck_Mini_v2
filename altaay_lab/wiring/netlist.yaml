# netlist.yaml: single source of truth for the altaay-lab Open Duck Mini v2 wiring.
# Rev 2026-11-01 (America/New_York). Read by wiring/make_schematic.py, make_harness.py, make_pictorial.py
# and by the lead's electrical rule check and ngspice power model. WIRING.md and CABLE_MAP.md follow this file.
#
# Tags in every "source" field: [U] upstream (Open_Duck_Mini docs, Runtime code at 376de65, Tnkr guide),
# [L] lab decision (D3, D8 to D13, D15, D17 in DECISIONS.md; D15 replaced D14), [I] inferred, check on the build.
# BLOCKER = open item.
#
# Schema (keep it simple, all keys lower case):
#   meta:        title, rev, units (lengths mm, currents A, voltages V).
#   domains:     name -> {v_min, v_max, note}. Every pin and net names one domain.
#   nets:        name -> {domain, note}. A net is one electrical node (a mated connector keeps its net).
#   components:  list. Each component:
#     id         short unique id used in wires (e.g. BMS, SW1, U3, PI, SV20)
#     ref        designator shown on the drawings
#     part       maker and part number
#     kind       battery, bms, charger, connector, fuse, switch, splice, regulator, board, sensor, servo, led,
#                resistor, speaker, camera, amplifier
#     region     battery_bay, belly, trunk_top, trunk_bottom, neck, head, left_leg, right_leg
#     ratings    free key/value pairs (optional)
#     groups     pin group -> {connector, pitch_mm (null if not a pitch connector), note}
#     pins       list of {pin, label, name, domain, group, dir, source}
#                  pin   = id used in wires (unique in the component)
#                  label = text printed on the part next to it (or the schematic name when nothing is printed)
#                  dir   = pwr_in, pwr_out, pwr, gnd, in, out, bidir, passive, nc (nc pins have no wire)
#     internal   list of {a, b, kind, note}: what joins two pins inside the part
#                  kind = short, switch, fuse, regulator, cell, sense, load, mated
#     source     where the part data comes from
#   cables:      list. One row per CABLE_MAP id:
#     {id, status (active or removed), desc, regions, joints, polyline_mm, rule_mm, source, note}
#     rule_mm follows the CABLE_MAP length rule (route polyline + 2 x 22.6 + 2 x 20 + 10 mm per radian crossed).
#   wires:       list. One row per conductor:
#     {cable, branch (optional), from: COMP.PIN, to: COMP.PIN, net, gauge, color, cut_mm, i_mean_a, i_peak_a,
#      i_fall_a (optional), ends: [end at from, end at to], source, note (optional)}
#     i_mean_a = walking mean, i_peak_a = worst 100 ms while walking, i_fall_a = worst 20 ms in a fall
#     (sim/CURRENT_BUDGET.md, sim pass only, pack at 7.4 V unless noted). null = not simulated.
#     cut_mm = length to cut. 0 = parts soldered directly together, no wire.

meta:
  title: Open Duck Mini v2, altaay-lab build, wiring netlist
  rev: "2026-11-01"
  units: {length: mm, current: A, voltage: V}
  orientation: "drawings show the robot seen from behind: robot left is on the left of the page"
  current_source: "sim/CURRENT_BUDGET.md (sim pass only): walking mean, worst 100 ms, worst 20 ms fall"
  decisions: "D17 (7:24 PM ET) foot switches Omron SS-01 (SS-10 fallback) with a 2.2 kOhm pull-up per foot to Pi pin 17; D13 projector resistor added; D15 servo power bypasses the adapter (BEC -> belly splices -> SP1 SP2 SP3), adapter H1 not connected, adapter gives DATA and GND only"
  battery_note: "Tenergy over-discharge cut is 2.40 V per cell, below the P30B 2.5 V minimum: stop in software when the servo Present Voltage reads about 6.0 V (about 3.3 V per cell loaded)"
  bench_check: "verify on the bench that the adapter enumerates and drives the bus with H1 unpowered (D15)"

domains:
  CELL_MID_3V0_4V2: {v_min: 3.0, v_max: 4.2, note: "holder series strap, one cell above B-"}
  PACK_6V0_8V4: {v_min: 6.0, v_max: 8.4, note: "2S pack, before and after the main switch"}
  SERVO_7V2: {v_min: 6.0, v_max: 7.4, note: "BEC set to 7.2 V; follows the pack below about 7.3 V (dropout not published)"}
  5V: {v_min: 4.8, v_max: 5.2, note: "Pololu D30V30F5 output, 4 % accuracy"}
  3V3: {v_min: 3.1, v_max: 3.5, note: "Pi 3.3 V rail"}
  GPIO_3V3: {v_min: 0.0, v_max: 3.3, note: "Pi GPIO, 3.3 V logic"}
  PWM_3V3: {v_min: 0.0, v_max: 3.3, note: "SG90 control pulses, 50 Hz, 1 to 2 ms (antennas.py)"}
  I2C: {v_min: 0.0, v_max: 3.3, note: "I2C1 at 3.3 V"}
  I2S: {v_min: 0.0, v_max: 3.3, note: "I2S at 3.3 V"}
  BUS_DATA: {v_min: 0.0, v_max: 3.3, note: "servo half-duplex data; adapter buffers SN74LVC1G125/126 run at 3V3 from USB VBUS (Waveshare schematic)"}
  USB: {v_min: 0.0, v_max: 5.25, note: "USB 2.0"}
  CSI: {v_min: 0.0, v_max: 1.8, note: "MIPI CSI-2 camera ribbon"}
  AUDIO: {v_min: -5.0, v_max: 5.0, note: "MAX98357A bridge output to the speaker"}
  CTRL: {v_min: 0.0, v_max: 8.4, note: "Pololu 2815 SW pad: 0 V = ON, VIN through 100 kOhm = OFF"}
  NTC: {v_min: 0.0, v_max: 8.4, note: "BMS thermistor lead, not used"}
  GND: {v_min: 0.0, v_max: 0.0, note: "common ground, returns to BMS P-"}
  GND_CELL: {v_min: 0.0, v_max: 0.0, note: "cell stack negative (BMS B-); never used as ground for loads"}

nets:
  CELL_N: {domain: GND_CELL, note: "holder - to BMS B-"}
  CELL_MID: {domain: CELL_MID_3V0_4V2, note: "series strap to BMS B1"}
  PACK_P: {domain: PACK_6V0_8V4, note: "holder +, BMS B+ and P+ (one copper node on the board), charger, XT30, fuse line side"}
  PACK_F: {domain: PACK_6V0_8V4, note: "fused pack +, fuse load side to Pololu 2815 VIN"}
  VSW: {domain: PACK_6V0_8V4, note: "switched pack bus after the 2815"}
  GND: {domain: GND, note: "every ground; one node at BMS P-"}
  CTRL_SW: {domain: CTRL, note: "2815 SW pad to the panel switch"}
  SERVO_7V2: {domain: SERVO_7V2, note: "BEC output, belly splice SPV, SP1 SP2 SP3, every servo V (not the adapter, D15)"}
  BUS_DATA: {domain: BUS_DATA, note: "servo bus data line"}
  5V: {domain: 5V, note: "U3 output, Pi 5 V pins, SG90 and amp supply"}
  3V3: {domain: 3V3, note: "Pi pin 1 to BNO055 VIN; Pi pin 17 to the foot pull-ups R4, R5 (D17)"}
  I2C_SDA: {domain: I2C, note: "GPIO2"}
  I2C_SCL: {domain: I2C, note: "GPIO3"}
  FOOT_L: {domain: GPIO_3V3, note: "GPIO22, internal pull-up plus 2.2 kOhm to 3V3 (D17), pressed = low, about 1.5 mA closed"}
  FOOT_R: {domain: GPIO_3V3, note: "GPIO27, internal pull-up plus 2.2 kOhm to 3V3 (D17), pressed = low, about 1.5 mA closed"}
  EYE_L: {domain: GPIO_3V3, note: "GPIO24 to the left eye resistor"}
  EYE_L_A: {domain: GPIO_3V3, note: "resistor to left eye LED anode"}
  EYE_R: {domain: GPIO_3V3, note: "GPIO23 to the right eye resistor"}
  EYE_R_A: {domain: GPIO_3V3, note: "resistor to right eye LED anode"}
  PROJ: {domain: GPIO_3V3, note: "GPIO25 to the projector resistor"}
  PROJ_A: {domain: GPIO_3V3, note: "resistor to projector LED anode"}
  ANT_L: {domain: PWM_3V3, note: "GPIO13 to the left antenna SG90"}
  ANT_R: {domain: PWM_3V3, note: "GPIO12 to the right antenna SG90"}
  I2S_LRC: {domain: I2S, note: "GPIO19"}
  I2S_BCLK: {domain: I2S, note: "GPIO18"}
  I2S_DIN: {domain: I2S, note: "GPIO21"}
  SPK_P: {domain: AUDIO, note: "amp + to speaker +"}
  SPK_N: {domain: AUDIO, note: "amp - to speaker -"}
  USB_LINK: {domain: USB, note: "Pi USB OTG port to adapter USB-C, /dev/ttyACM0 at 1 Mbaud"}
  CSI_LINK: {domain: CSI, note: "Pi CSI to Camera Module 3"}

components:
  - id: PACK
    ref: BT1
    part: 2x Molicel INR18650-P30B in the 2S spring holder B09WCT8672
    kind: battery
    region: battery_bay
    ratings: {cells: "2S", capacity_ah: 3.0, cell_i_cont_a: 30, v_range: "6.0 to 8.4"}
    groups:
      leads: {connector: "holder leads, solder", pitch_mm: null, note: "use the holder leads for P1/P2 if 120 mm or longer"}
      strap: {connector: "solder pad on the holder series strap", pitch_mm: null}
    pins:
      - {pin: "B+", label: "+", name: pack + (cell 2 +), domain: PACK_6V0_8V4, group: leads, dir: pwr_out, source: "[U] holder"}
      - {pin: "MID", label: "strap", name: series strap (cell 1 + / cell 2 -), domain: CELL_MID_3V0_4V2, group: strap, dir: passive, source: "[L] B27, Tnkr m1 m2"}
      - {pin: "B-", label: "-", name: pack - (cell 1 -), domain: GND_CELL, group: leads, dir: pwr_out, source: "[U] holder"}
    internal:
      - {a: "B-", b: "MID", kind: cell, note: "cell 1, Molicel P30B"}
      - {a: "MID", b: "B+", kind: cell, note: "cell 2, Molicel P30B"}
    source: "[U] holder, [L] cells (BOM 6, 7)"

  - id: BMS
    ref: U5
    part: Tenergy P/N 32175 2S protection board (board marking RYD-02S-032)
    kind: bms
    region: battery_bay
    ratings: {i_work_a: 10, i_oc_detect_a: "22 +/- 5", oc_delay_ms: "8 +/- 4", r_loop_mohm_max: 25, ov_detect_v: "4.280 +/- 0.025", uv_detect_v: "2.40 +/- 0.05", balancing: none, size_mm: "34 x 16 x 4.5", ntc: "10k 3380 1 %"}
    groups:
      pads: {connector: "solder pad", pitch_mm: null, note: "pad names from the Tenergy product image 32175-spec"}
    pins:
      - {pin: "B-", label: "B-", name: cell stack -, domain: GND_CELL, group: pads, dir: pwr_in, source: "[L] Tenergy image"}
      - {pin: "B1", label: "B1", name: mid tap (called BM in the brief), domain: CELL_MID_3V0_4V2, group: pads, dir: in, source: "[L] Tenergy image"}
      - {pin: "B+", label: "B+", name: cell stack +, domain: PACK_6V0_8V4, group: pads, dir: pwr_in, source: "[L] Tenergy image"}
      - {pin: "P-", label: "P-", name: pack output - (charge and discharge), domain: GND, group: pads, dir: gnd, source: "[L] Tenergy image"}
      - {pin: "P+", label: "P+", name: pack output + (charge and discharge), domain: PACK_6V0_8V4, group: pads, dir: pwr_out, source: "[L] Tenergy image"}
      - {pin: "T", label: "T", name: NTC output, domain: NTC, group: pads, dir: nc, source: "[L] Tenergy image; left unconnected, that it may be left open is [I] (not stated by Tenergy)"}
    internal:
      - {a: "B+", b: "P+", kind: short, note: "through copper"}
      - {a: "B-", b: "P-", kind: switch, note: "protection MOSFETs and 2x R006 sense resistors; opens on fault; P- is not B-"}
      - {a: "B1", b: "B-", kind: sense, note: "cell voltage sense, 10 uA max board current"}
    source: "[L] D10; https://power.tenergy.com/protection-circuit-module-pcb-for-7-2v-7-4v-2s-li-ion-battery-pack-working-10a-cutoff-22a-ntc"

  - id: CHG
    ref: U6
    part: USB-C 2S charger board, Adeept B0BJTW4QBR (BOM 11)
    kind: charger
    region: battery_bay
    ratings: {output: "8.4 V 2S", i_charge_a: "2 (seller)"}
    groups:
      out: {connector: "solder pad", pitch_mm: null, note: "pad labels not verified [I]"}
      usb: {connector: "USB-C receptacle", pitch_mm: null}
    pins:
      - {pin: "B+", label: "B+", name: charge output +, domain: PACK_6V0_8V4, group: out, dir: pwr_out, source: "[U] CABLE_MAP; label [I]"}
      - {pin: "B-", label: "B-", name: charge output -, domain: GND, group: out, dir: gnd, source: "[U] CABLE_MAP; label [I]"}
      - {pin: "USB", label: "USB-C", name: 5 V USB-C input from a charger, domain: USB, group: usb, dir: nc, source: "[U]"}
    source: "[U] BOM 11"

  - id: XT30
    ref: J1
    part: Amass XT30U pair (BOM 12), female on the pack side, male on the robot side
    kind: connector
    region: battery_bay
    ratings: {i_cont_a: 15}
    groups:
      female: {connector: "XT30U female, solder cups", pitch_mm: null}
      male: {connector: "XT30U male, solder cups", pitch_mm: null}
    pins:
      - {pin: "F+", label: "+", name: pack side +, domain: PACK_6V0_8V4, group: female, dir: pwr, source: "[U]"}
      - {pin: "F-", label: "-", name: pack side -, domain: GND, group: female, dir: gnd, source: "[U]"}
      - {pin: "M+", label: "+", name: robot side +, domain: PACK_6V0_8V4, group: male, dir: pwr, source: "[U]"}
      - {pin: "M-", label: "-", name: robot side -, domain: GND, group: male, dir: gnd, source: "[U]"}
    internal:
      - {a: "F+", b: "M+", kind: mated, note: "pack disconnect"}
      - {a: "F-", b: "M-", kind: mated, note: "pack disconnect"}
    source: "[U] BOM 12; position from Tnkr (left of the holder, standing)"

  - id: F1
    ref: F1
    part: Littelfuse FHAC0001ZXJ inline ATO holder (20 A, 32 V) with Littelfuse 0287015.PXCN ATO 15 A 32 V
    kind: fuse
    region: battery_bay
    ratings: {fuse_a: 15, holder_a: 20, v_max: 32, leads: "16 AWG, 90 mm each", body_mm: "50 x 17.2 x 17.2"}
    groups:
      leads: {connector: "ATO holder leads", pitch_mm: null, note: "the two holder leads are wires P7"}
    pins:
      - {pin: "IN", label: "lead 1", name: line side (from XT30), domain: PACK_6V0_8V4, group: leads, dir: pwr_in, source: "[L] D3"}
      - {pin: "OUT", label: "lead 2", name: load side (to 2815 VIN), domain: PACK_6V0_8V4, group: leads, dir: pwr_out, source: "[L] D3"}
    internal:
      - {a: "IN", b: "OUT", kind: fuse, note: "15 A ATO"}
    source: "[L] D3; MOUNTING.md: battery bay front wall, BMS side, centre (-104.5, -21.5, 26.0)"

  - id: SW1
    ref: SW1
    part: Pololu 2815 Big MOSFET Slide Switch with Reverse Voltage Protection, HP
    kind: switch
    region: battery_bay
    ratings: {v_op: "4.5 to 32", i_cont_55c_a: 6.0, i_cont_150c_a: 16, i_max_a: 90, r_on_mohm: "13 at 4.5 V, 8.6 at 10 V", size_mm: "20.3 x 22.9", mounting: "no mounting holes; the four 2.18 mm holes are power connections; foam tape"}
    groups:
      power: {connector: "large holes (5 mm terminal block spacing), solder 16 AWG", pitch_mm: 5.0, note: "Pololu: use the large holes above 5 A"}
      control: {connector: "0.1 in holes, solder", pitch_mm: 2.54, note: "pad pair marked with a switch symbol: SW and GND"}
    pins:
      - {pin: "VIN", label: "VIN", name: fused pack in, domain: PACK_6V0_8V4, group: power, dir: pwr_in, source: "[L] Pololu 2815 page"}
      - {pin: "GND", label: "GND", name: ground (large hole), domain: GND, group: power, dir: gnd, source: "[L] Pololu 2815 page"}
      - {pin: "VOUT", label: "VOUT", name: switched pack out, domain: PACK_6V0_8V4, group: power, dir: pwr_out, source: "[L] Pololu 2815 page"}
      - {pin: "SW", label: "switch symbol", name: switch control terminal, domain: CTRL, group: control, dir: in, source: "[L] Pololu schematic net SW"}
      - {pin: "GND_SW", label: "switch symbol", name: GND pad next to SW, domain: GND, group: control, dir: gnd, source: "[L] Pololu schematic"}
      - {pin: "ON", label: "ON", name: logic ON input, domain: CTRL, group: control, dir: nc, source: "[L] Pololu page: disconnected = off"}
    internal:
      - {a: "VIN", b: "VOUT", kind: switch, note: "2 P-MOSFETs, on while SW is pulled to GND; on-board slide switch set OFF"}
      - {a: "GND", b: "GND_SW", kind: short}
      - {a: "VIN", b: "SW", kind: load, note: "100 kOhm (R3): about 84 uA when SW is grounded at 8.4 V"}
    source: "[L] D8; https://www.pololu.com/product/2815; MOUNTING.md: battery bay front wall, centre (-108.5, 19.0, 36.5)"

  - id: CTL
    ref: S1
    part: stock panel switch in the body_back cutout (CAD power_switch.stl, upstream Amazon B0CH3JCQM5; BOM 10b)
    kind: switch
    region: battery_bay
    groups:
      lugs: {connector: "solder lugs", pitch_mm: null, note: "terminal count not verified; use the 2 lugs that close when ON [I]"}
    pins:
      - {pin: "1", label: "1", name: contact, domain: CTRL, group: lugs, dir: passive, source: "[I]"}
      - {pin: "2", label: "2", name: contact, domain: GND, group: lugs, dir: passive, source: "[I]"}
    internal:
      - {a: "1", b: "2", kind: switch, note: "closed = robot ON; carries under 0.1 mA"}
    source: "[U] switch, [L] D8 use as control switch only"

  - id: VSW
    ref: VSW
    part: solder splice with heat shrink (switched pack bus node)
    kind: splice
    region: battery_bay
    groups:
      s: {connector: "solder splice, heat shrink", pitch_mm: null}
    pins:
      - {pin: "S", label: "VSW", name: splice, domain: PACK_6V0_8V4, group: s, dir: pwr, source: "[L]"}
    source: "[L] next to the 2815"

  - id: G
    ref: G
    part: solder splice with heat shrink (common ground node)
    kind: splice
    region: battery_bay
    groups:
      s: {connector: "solder splice, heat shrink", pitch_mm: null}
    pins:
      - {pin: "S", label: "G", name: splice, domain: GND, group: s, dir: gnd, source: "[L]"}
    source: "[L] next to the 2815; reaches BMS P- through P14, XT30, P8"

  - id: U1
    ref: U1
    part: Castle Creations CC BEC Pro, P/N 010-0004-01, set to 7.2 V
    kind: regulator
    region: belly
    ratings: {v_in: "2S to 12S", i_cont_a: "15 at 2S to 4S with 5 mph air", i_peak_a: 20, v_out: 7.2, size_mm: "43 x 33 x 24", output_lead_a: "5 per 3-pin lead (Castle guide)"}
    groups:
      in: {connector: "input leads red and black (gauge and length not published)", pitch_mm: null}
      out1: {connector: "3-pin servo lead 1 (cut)", pitch_mm: null}
      out2: {connector: "3-pin servo lead 2 (cut)", pitch_mm: null}
      link: {connector: "Link Port, 2-wire jumper to Castle Link V4", pitch_mm: null, note: "programming only"}
    pins:
      - {pin: "IN+", label: "red", name: input +, domain: PACK_6V0_8V4, group: in, dir: pwr_in, source: "[L] Castle guide 095-0047-00"}
      - {pin: "IN-", label: "black", name: input -, domain: GND, group: in, dir: gnd, source: "[L] Castle guide"}
      - {pin: "OUT1+", label: "red", name: output lead 1 +, domain: SERVO_7V2, group: out1, dir: pwr_out, source: "[L] Castle guide"}
      - {pin: "OUT1-", label: "black", name: output lead 1 -, domain: GND, group: out1, dir: gnd, source: "[L] Castle guide"}
      - {pin: "OUT1S", label: "3rd wire", name: output lead 1 third wire, domain: GND, group: out1, dir: nc, source: "[I] insulate"}
      - {pin: "OUT2+", label: "red", name: output lead 2 +, domain: SERVO_7V2, group: out2, dir: pwr_out, source: "[L] Castle guide"}
      - {pin: "OUT2-", label: "black", name: output lead 2 -, domain: GND, group: out2, dir: gnd, source: "[L] Castle guide"}
      - {pin: "OUT2S", label: "3rd wire", name: output lead 2 third wire, domain: GND, group: out2, dir: nc, source: "[I] insulate"}
      - {pin: "LINK", label: "Link Port", name: programming port, domain: GND, group: link, dir: nc, source: "[L] Castle guide"}
    internal:
      - {a: "IN+", b: "OUT1+", kind: regulator, note: "buck set to 7.2 V; dropout not published"}
      - {a: "IN-", b: "OUT1-", kind: short}
      - {a: "OUT1+", b: "OUT2+", kind: short}
      - {a: "OUT1-", b: "OUT2-", kind: short}
    source: "[L] D3; MOUNTING.md: belly floor, centre (-71.5, -0.5, -8.0), leads toward the battery bay"

  - id: JBP
    ref: JB+
    part: solder splice, both BEC output reds joined
    kind: splice
    region: belly
    groups:
      s: {connector: "solder splice, heat shrink", pitch_mm: null}
    pins:
      - {pin: "S", label: "JB+", name: splice, domain: SERVO_7V2, group: s, dir: pwr, source: "[L]"}
    source: "[L] POWER.md: cut both output leads, red to red"

  - id: JBN
    ref: JB-
    part: solder splice, both BEC output blacks joined
    kind: splice
    region: belly
    groups:
      s: {connector: "solder splice, heat shrink", pitch_mm: null}
    pins:
      - {pin: "S", label: "JB-", name: splice, domain: GND, group: s, dir: gnd, source: "[L]"}
    source: "[L] POWER.md: black to black"

  - id: U2
    ref: U2
    part: Waveshare Bus Servo Adapter (A), SKU 25514
    kind: board
    region: trunk_top
    ratings: {size_mm: "42 x 33", input_wiki: "9 to 12.6 V", h3_note: "schematic marks MAX:6A at the servo header", d15: "servo power bypasses the board; H1 not connected; logic 3.3 V from USB VBUS through diodes (schematic)"}
    groups:
      h1: {connector: "green screw terminal KF350-2P (schematic H1)", pitch_mm: 3.5, note: "printed DC+ and DC-; pitch [I] from the KF350 series"}
      h3: {connector: "Molex 5264-type 2.5 mm 3-pin socket (white)", pitch_mm: 2.5, note: "printed D V G; H3 and H5 are in parallel"}
      h5: {connector: "Molex 5264-type 2.5 mm 3-pin socket (white)", pitch_mm: 2.5, note: "printed D V G; which socket is H3 is not printed [I]"}
      usb: {connector: "USB-C receptacle, printed USB", pitch_mm: null}
      jack: {connector: "DC barrel jack 5.5 x 2.1 mm, printed DC 9~12.6V", pitch_mm: null, note: "not used"}
      jumper: {connector: "A/B jumper", pitch_mm: 2.54, note: "B = USB ~ SERVO (set), A = UART ~ SERVO"}
      uart: {connector: "3-pin header TX RX GND", pitch_mm: 2.54, note: "not used"}
    pins:
      - {pin: "DC+", label: "DC+", name: servo supply + (H1 pin 2), domain: SERVO_7V2, group: h1, dir: nc, source: "[L] D15: H1 not connected"}
