    part: MMBF170 enable FET. Already on the charger bill. Not a second FET. Its gate is the EN node the comparators pull down.
    kind: board
    region: battery_bay
    groups:
      pads: {connector: "solder pads", pitch_mm: null}
    pins:
      - {pin: G, label: G, name: enable gate, domain: GPIO_3V3, group: pads, dir: in, source: "[L] charger_board.yaml CQEN.G"}
    source: "[L] circuitry/charger_board.yaml. Source and drain stay the PROG switch in that file."

  - id: JPI
    ref: JPI
    part: charger board pads for STAT, enable, 3.3 V, and ground. STAT is MCP73213 pin 7. Enable is the board gate in CHARGER_BOARD.md, not a chip pin.
    kind: connector
    region: battery_bay
    groups:
      pads: {connector: "solder pads", pitch_mm: null, note: "Pi end of STAT and EN is housing 0022012027. 3.3 V and ground join cable D2."}
    pins:
      - {pin: STAT, label: STAT, name: GPIO5, domain: GPIO_3V3, group: pads, dir: out, source: "[L] CHARGER_BOARD.md"}
      - {pin: EN, label: EN, name: GPIO6, domain: GPIO_3V3, group: pads, dir: in, source: "[L] CHARGER_BOARD.md"}
      - {pin: V3, label: "3V3", name: Pi 3.3 V, domain: 3V3, group: pads, dir: pwr_in, source: "[L] CHARGER_BOARD.md"}
      - {pin: GND, label: GND, name: ground, domain: GND, group: pads, dir: gnd, source: "[L] CHARGER_BOARD.md"}
    source: "[L] CHARGER_BOARD.md and circuitry/charger_board.yaml JPI"

  - id: WK1
    ref: D3
    part: wake branch, 3.9 V zener, small signal diode and 10 k in series (BOM DK5)
    kind: diode
    region: battery_bay
    groups:
      leads: {connector: "solder, in heat shrink on the DC3 lead", pitch_mm: null, note: "inline"}
    pins:
      - {pin: "A", label: "A", name: from SENSE, domain: SENSE, group: leads, dir: in, source: "[L] D43"}
      - {pin: "K", label: "K", name: to SW1 ON, domain: CTRL, group: leads, dir: out, source: "[L] D43"}
    internal:
      - {a: "A", b: "K", kind: load, note: "conducts only above 3.9 V plus a diode drop: the 9 V wake pulse, never the NTC reading"}
    source: "[L] D43; BOM DK5"

  - id: DK6
    ref: D4
    part: Pololu 5382 ideal diode reverse voltage protector 4-60 V 10 A, dock supply SYS (BOM DK6, D50)
    kind: diode
    region: battery_bay
    groups:
      pads: {connector: "solder pads", pitch_mm: null, note: "0.3 x 0.5 in board, VHB beside SW1"}
    pins:
      - {pin: "VIN", label: "VIN", name: from the SYS strip, domain: SYS_9V, group: pads, dir: pwr_in, source: "[L] D50"}
      - {pin: "VOUT", label: "VOUT", name: to SW1 VIN, domain: PACK_OR_6V0_9V2, group: pads, dir: pwr_out, source: "[L] D50"}
      - {pin: "GND", label: "GND", name: ground, domain: GND, group: pads, dir: gnd, source: "[L] Pololu page"}
    internal:
      - {a: "VIN", b: "VOUT", kind: switch, note: "ideal diode: the SYS strip is dead when undocked"}
    source: "[L] D50; BOM DK6"

  - id: DK7
    ref: D5
    part: Pololu 5383 ideal diode reverse voltage protector 4-60 V 12 A, pack side (BOM DK7, D50)
    kind: diode
    region: battery_bay
    ratings: {i_cont_a: 12, i_few_s_a: 40, r_on_mohm: "under 5"}
    groups:
      pads: {connector: "solder pads", pitch_mm: null, note: "0.3 x 0.5 in board, VOUT soldered on SW1 VIN"}
    pins:
      - {pin: "VIN", label: "VIN", name: fused pack from JFO, domain: PACK_9V0_12V6, group: pads, dir: pwr_in, source: "[L] D50"}
      - {pin: "VOUT", label: "VOUT", name: to SW1 VIN, domain: PACK_OR_6V0_9V2, group: pads, dir: pwr_out, source: "[L] D50"}
      - {pin: "GND", label: "GND", name: ground, domain: GND, group: pads, dir: gnd, source: "[L] Pololu page"}
    internal:
      - {a: "VIN", b: "VOUT", kind: switch, note: "ideal diode: the dock supply never back-feeds the pack"}
    source: "[L] D50; BOM DK7"

