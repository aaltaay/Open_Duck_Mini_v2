# Open Duck Mini v2, Altaay lab print package. PrusaSlicer 2.7.2 filament settings.
# Overture TPU 95A 1.75 mm (BOM line 28). Maker-typical values, not lab-tested:
#   maker page https://overture3d.com/products/overture-tpu (read 2026-11-01): nozzle 210 to 240 C,
#   bed 35 to 50 C, fan on, "recommended print speed 20 to 40 mm/s", "retraction OFF or minimal",
#   dry at 70 C for 7 h. Shore 95A.
#   TDS (TPU 2.0, linked on that page): density 1.216 g/cm3, test prints at 240 C, 30 mm/s, 35 C plate.
#   The TDS also lists 200 mm/s; the product page says 20 to 40 mm/s. We use 25 mm/s (works on
#   Bowden and direct drive printers).
filament_settings_id = Overture TPU 95A (maker-typical)
filament_type = FLEX
filament_diameter = 1.75
filament_density = 1.216
filament_cost = 0
extrusion_multiplier = 1
temperature = 225
first_layer_temperature = 230
bed_temperature = 40
first_layer_bed_temperature = 45
filament_max_volumetric_speed = 3.5
cooling = 1
fan_always_on = 1
min_fan_speed = 50
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 2
fan_below_layer_time = 60
slowdown_below_layer_time = 10
min_print_speed = 10
filament_retract_length = 0.8
filament_retract_speed = 25
filament_retract_lift = 0
