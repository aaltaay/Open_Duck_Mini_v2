# Per-part override: parts with tight fits (6804 bearing seats with 0.19 mm clearance, and
# STS3215 servo pockets with 0.00 to 0.10 mm CAD interference). Load after pla_print.ini.
# Outer wall first and slower, so the wall that touches the bearing or servo is laid down at
# its CAD position and is not pushed into the hole by the inner walls.
external_perimeters_first = 1
external_perimeter_speed = 25
