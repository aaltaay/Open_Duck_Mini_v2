# Open Duck Mini v2, Altaay lab print package. PrusaSlicer 2.7.2 filament settings.
# Overture Easy PLA 1.75 mm (BOM line 27). Maker-typical values, not lab-tested:
#   maker page https://overture3d.com/products/overture-easy-pla-3d-printer-filament (read 2026-11-01):
#   nozzle 190 to 220 C, bed 25 to 60 C, speed 40 to 60 mm/s, fan on.
#   TDS v5.1 (linked on that page): density 1.20 g/cm3, test prints at 205 C nozzle and 40 C plate,
#   retraction 1 to 3 mm at 20 to 40 mm/s, speed 40 to 90 mm/s.
filament_settings_id = Overture Easy PLA (maker-typical)
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.20
filament_cost = 0
extrusion_multiplier = 1
temperature = 205
first_layer_temperature = 210
bed_temperature = 55
first_layer_bed_temperature = 60
filament_max_volumetric_speed = 11
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
fan_below_layer_time = 100
slowdown_below_layer_time = 10
min_print_speed = 15
filament_retract_length = 1.5
filament_retract_speed = 35
