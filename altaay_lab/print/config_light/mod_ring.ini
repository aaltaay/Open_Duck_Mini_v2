# Open Duck Mini v2, Altaay lab print package, LIGHT set (proposal, altaay_lab/print/MASS_STUDY.md).
# Settings of the solid rings: PrusaSlicer modifier volumes ("ParameterModifier") that print/mass_study.py places
# round the holes named in config_light/parts_light.csv (column "rings"). A ring is a cylinder coaxial with the
# hole and 0.6 mm longer than the hole at each end. Hole sizes and positions are found in the print-oriented STL
# (mass_study.py holes; counts match PRINT_CHECK.md and audit/sites.json: 58 insert bores in all). In the proposed
# set (parts_light.csv) rings go on 40 insert bores and 5 pilots per robot; the seat ring is used only by the light
# head option (d) of MASS_STUDY.md, which is not proposed.
#   insert  M3 heat-set bore, 3.80 to 4.25 mm, at least 4 mm deep: ring diameter = bore + 4.0 mm, so 2.0 mm of
#           solid plastic round the bore. The 4-wall override (ovr_insert.ini) gave about 1.67 mm; the lab minimum
#           is 1.6 mm (CNC Kitchen minimum wall, PRINT_CHECK.md flag 1).
#   pilot   screw pilot, 1.85 to 2.35 mm, at least 3 mm deep: ring diameter = pilot + 3.0 mm, so 1.5 mm solid.
#           The old 3-wall base gave about 1.27 mm (config/pla_print.ini).
#   seat    6804 bearing seat, 31.5 to 33.0 mm: ring diameter = seat + 4.0 mm, so 2.0 mm solid.
# Only the infill changes inside a ring. Checked on this box (MASS_STUDY.md): a ring set to the base 15% gives the
# same grams as no ring (body_middle_top 74.060 g both), so the walls stay continuous and no extra walls form at
# the ring edge; at 100% the infill inside the ring becomes solid.
# In the PrusaSlicer GUI: right click the part, Add modifier, Cylinder, set Infill density 100%. Other slicers:
# a modifier or "part settings" volume with 100% infill does the same.
fill_density = 100%
