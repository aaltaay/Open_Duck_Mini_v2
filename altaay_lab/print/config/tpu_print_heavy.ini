# HEAVY set: the tpu_print.ini used before DECISIONS.md D22 (3 walls), kept unchanged except this note and
# print_settings_id. slice.py --set heavy loads it (with the parts.csv "heavy" overrides, no rings) to reproduce
# the package before D22. The S1 gate fallback of D22 does not need it: the 10 ring parts then take ovr_insert.ini
# (4 walls), which sets the same walls on either base.
# Open Duck Mini v2, Altaay lab print package. PrusaSlicer 2.7.2 print settings, TPU.
# Only foot_bottom_tpu.stl (x2). Upstream (docs/print_guide.md) fixes the infill: TPU 40%.
print_settings_id = ODM TPU 0.20 40pct heavy (before D22)
layer_height = 0.2
first_layer_height = 0.2
variable_layer_height = 0
perimeters = 3
perimeter_generator = arachne
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
min_feature_size = 25%
min_bead_width = 85%
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 40%
fill_pattern = gyroid
fill_angle = 45
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
infill_overlap = 25%
solid_infill_below_area = 70
seam_position = aligned
external_perimeters_first = 0
extrusion_width = 0.45
first_layer_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.45
elefant_foot_compensation = 0.1
xy_size_compensation = 0
thick_bridges = 1
overhangs = 1
# No supports: TPU supports fuse to the part. The sole needs none in its print orientation.
support_material = 0
support_material_auto = 0
raft_layers = 0
brim_width = 0
skirts = 1
skirt_distance = 3
skirt_height = 1
complete_objects = 0
# Slow and even (maker page: 20 to 40 mm/s).
perimeter_speed = 25
external_perimeter_speed = 25
small_perimeter_speed = 20
infill_speed = 25
solid_infill_speed = 25
top_solid_infill_speed = 20
bridge_speed = 20
gap_fill_speed = 20
first_layer_speed = 15
travel_speed = 120
max_print_speed = 25
default_acceleration = 800
perimeter_acceleration = 0
infill_acceleration = 0
bridge_acceleration = 0
first_layer_acceleration = 500
travel_acceleration = 1000
avoid_crossing_perimeters = 1
only_retract_when_crossing_perimeters = 1
