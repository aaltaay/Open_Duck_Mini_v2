# Open Duck Mini v2, Altaay lab print package. PrusaSlicer 2.7.2 config.
# Generic printer used ONLY to make slicer estimates on the box. The real printer is not known.
# 0.4 mm nozzle, 1.75 mm filament, 220 x 220 bed. Load bed_256.ini after this file for a 256 bed.
# Speeds and limits are moderate (Prusa MK3S class). A fast printer will finish sooner.
# When you print, use YOUR printer profile (bed, retraction, start G-code) with the print and
# filament files from this folder. Keys not set here are PrusaSlicer 2.7.2 defaults.
printer_technology = FFF
printer_settings_id = ODM generic 220 (estimates only)
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 1
layer_gcode = G92 E0
gcode_label_objects = octoprint
gcode_comments = 0
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 1500,1500
machine_max_acceleration_retracting = 1500,1500
machine_max_acceleration_travel = 1500,1500
machine_max_acceleration_x = 1500,1500
machine_max_acceleration_y = 1500,1500
machine_max_acceleration_z = 200,200
machine_max_acceleration_e = 5000,5000
machine_max_feedrate_x = 200,200
machine_max_feedrate_y = 200,200
machine_max_feedrate_z = 12,12
machine_max_feedrate_e = 60,60
machine_max_jerk_x = 8,8
machine_max_jerk_y = 8,8
machine_max_jerk_z = 0.4,0.4
machine_max_jerk_e = 4.5,4.5
retract_length = 1.5
retract_speed = 35
deretract_speed = 0
retract_lift = 0.2
retract_before_travel = 2
retract_layer_change = 1
wipe = 0
z_offset = 0
start_gcode = G90 ; absolute XYZ\nM83 ; relative E\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28 ; home\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG1 Z5 F3000\n
end_gcode = M104 S0\nM140 S0\nM107\nG91\nG1 Z10 F600\nG90\nM84\n
