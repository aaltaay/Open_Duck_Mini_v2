# Per-part override: parts with M3 heat-set insert bores (4.0 mm, 5.8 mm deep).
# Load after pla_print.ini. Parts: see parts.csv (override "insert"; since D22 the head and trunk_bottom).
# Also the S1 gate fallback of D22: if a light coupon (C2aL, C2bL, C3L) fails, the 10 ring parts print with this
# override and no rings (parts.csv "heavy" column). It sets the walls itself, so the base file does not matter.
# 4 walls put about 1.67 mm of solid plastic round every 4.0 mm bore (0.45 + 3 x 0.41),
# more than the 1.6 mm CNC Kitchen minimum wall in PRINT_CHECK flag 1. In foot_top the bore
# wall is only 1.5 mm, so 4 walls from each side fill it completely (B16: wall is solid).
perimeters = 4
