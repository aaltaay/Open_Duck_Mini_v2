# Per-part override: neck and head chain (neck_left_sheet, neck_right_sheet, head_pitch_to_yaw,
# head_yaw_to_roll, head_roll_mount). Load after pla_print.ini (and before ovr_fit.ini).
# Upstream issue Mini #33 says a neck part breaks often (the part is not named) and Runtime #32
# broke a head part (UPSTREAM_ISSUES.md G5, G6). Walls carry most of the bending load in a
# printed part, so 5 walls (about 2.1 mm, which makes most of these parts solid) and 40% infill.
perimeters = 5
fill_density = 40%
