# HEAVY set: the pla_print.ini used before DECISIONS.md D22 (3 walls), kept unchanged except this note and
# print_settings_id. slice.py --set heavy loads it (with the parts.csv "heavy" overrides, no rings) to reproduce
# the package before D22. The S1 gate fallback of D22 does not need it: the 10 ring parts then take ovr_insert.ini
# (4 walls), which sets the same walls on either base.
# Open Duck Mini v2, Altaay lab print package. PrusaSlicer 2.7.2 print settings, PLA base.
# Used for every PLA part. Per-part overrides (ovr_insert.ini, ovr_fit.ini) are loaded after this.
# Upstream (docs/print_guide.md) fixes only the infill: PLA 15%. Everything else is a lab choice.
print_settings_id = ODM PLA 0.20 heavy base (before D22)
layer_height = 0.2
first_layer_height = 0.2
variable_layer_height = 0
# 3 walls (about 1.27 mm): solid ring round the 2.0 mm screw pilots. Old run used 2.
perimeters = 3
perimeter_generator = arachne
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
thin_walls = 0
min_feature_size = 25%
min_bead_width = 85%
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
fill_angle = 45
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
infill_overlap = 25%
solid_infill_below_area = 70
seam_position = aligned
external_perimeters_first = 0
extrusion_width = 0.45
first_layer_extrusion_width = 0.42
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
support_material_extrusion_width = 0.35
# First layer squish makes bores at the bed smaller. 0.15 mm is a typical start value.
elefant_foot_compensation = 0.15
# Hole size: no compensation by default. Change only after coupon C1/C4 (PRINT_PLAN.md).
xy_size_compensation = 0
thick_bridges = 1
bridge_flow_ratio = 1
overhangs = 1
# Supports: automatic, snug style, only for surfaces flatter than 40 degrees from the bed.
# The old PRINT_CHECK run used 45; at 40, 45 degree chamfers and the 42 degree inner walls of
# body_back print without support (saves about 21 g and 4 h over all parts). Snug, not organic:
# organic branches reached up to 20 mm past the part outline (the head print then ran 6 mm past
# a 220 bed); snug stays within 3 mm and used 17 g and 9 h less over all parts on this box.
# No supports under bridges.
support_material = 1
support_material_auto = 1
support_material_threshold = 40
support_material_style = snug
support_material_buildplate_only = 0
support_material_contact_distance = 0.2
support_material_bottom_contact_distance = 0.2
support_material_interface_layers = 2
support_material_bottom_interface_layers = 0
support_material_spacing = 2.5
support_material_interface_spacing = 0.2
support_material_xy_spacing = 60%
dont_support_bridges = 1
raft_layers = 0
brim_width = 0
skirts = 1
skirt_distance = 3
skirt_height = 1
min_skirt_length = 0
complete_objects = 0
# Speeds in mm/s, inside the maker range 40 to 90 mm/s (Overture Easy PLA TDS v5.1).
perimeter_speed = 50
external_perimeter_speed = 35
small_perimeter_speed = 30
infill_speed = 80
solid_infill_speed = 60
top_solid_infill_speed = 40
support_material_speed = 50
support_material_interface_speed = 80%
bridge_speed = 30
gap_fill_speed = 40
first_layer_speed = 25
travel_speed = 150
max_print_speed = 80
max_volumetric_speed = 0
default_acceleration = 1000
perimeter_acceleration = 800
external_perimeter_acceleration = 0
infill_acceleration = 1250
solid_infill_acceleration = 0
top_solid_infill_acceleration = 0
bridge_acceleration = 1000
first_layer_acceleration = 800
travel_acceleration = 1500
avoid_crossing_perimeters = 0
only_retract_when_crossing_perimeters = 0
